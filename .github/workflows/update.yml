name: Dashboard'u yayınla

# Bu iş akışı VERİ TOPLAMAZ. MB sunucusu GitHub runner'larının IP'lerini
# ağ seviyesinde düşürüyor (TCP 80/443 timeout), bu yüzden toplama yerelde
# `guncelle.ps1` ile yapılır ve veri repoya push edilir.
# Burada yalnızca commit'lenmiş CSV'den dashboard üretilip Vercel'e yayınlanır.

on:
  push:
    branches: [main]
    paths:
      - "data/kktcmb.csv"
      - "data/scrape_meta.json"
      - "build_dashboard.py"
      - "template.html"
      - "_fonts.py"
      - "_palette.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: veri-yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Son veri ayı
        id: veri
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          with open("data/kktcmb.csv", encoding="utf-8") as f:
              satir = [r for r in csv.DictReader(f) if r["deger"].strip()]
          print("ay=" + max(r["tarih"] for r in satir)[:7])
          print("nokta=" + str(len(satir)))
          PY

      - name: Dashboard üret
        run: python build_dashboard.py

      - name: Vercel'e yayınla
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy site --prod --yes --project kktcmb-dashboard --token "$VERCEL_TOKEN"

      - name: Özet
        run: |
          echo "Son veri ayı: ${{ steps.veri.outputs.ay }}"
          echo "Veri noktası: ${{ steps.veri.outputs.nokta }}"
          echo "Yayın: https://kktcmb-dashboard.vercel.app"
